name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as GitHub's own Pages template has them: the deploy job starts only after the build job has finished and its
  # artifact is stored. In one job, deploy-pages@v4 often could not find the artifact just uploaded ("No artifacts named
  # github-pages", 25-26 Nov, also with upload-pages-artifact v4: #804, #803).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # The solo game here has no table server of its own: the feedback button posts to the public one (it must run a build with POST /feedback).
      - run: npm run build
        env:
          HEXTABLE_FEEDBACK_URL: https://hextable-production.up.railway.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
