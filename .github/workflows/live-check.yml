name: Live check

# Is the live site the version that was merged? (review R1, #617)
# Every 30 minutes, compare /build.json on Railway and on GitHub Pages with the head of main. When main's head is
# older than 20 minutes and a site reports another commit, open (or add to) the issue "Live site is not the merged version".

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/live-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
