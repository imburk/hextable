<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: one token, one menu (#527, round 2)</title>
<!-- A picture to react to (docs/specs/one-token-menu.md). Nothing here runs the game: every number is made up and every
     control only shows what it would do. Self-contained: no network, no fonts fetched (the game's font names come first,
     with fallbacks). The address can set the picture, for screenshots:
       #theme=classic|sunlit|pocket  frame=phone|desktop  state=explore|other|mine|down  open=root|character|cast|story|turns|dice|setup
       motion=slide|appear  bare (hides the mockup's own controls)  prompt=reaction|initiative|aim  chars=one|familiar|solo
       look=<dice look id>  waiting (a handout waits)  seen (the ring's note was already seen)  hit (Wren was just hit)
     Round 2 (the owner's feedback): slower slides, sections open in place and nothing scrolls by itself, the choice of
     character on the first level, a badge only when something waits, the health ring explained, a calmer throw, dice
     looks, and Roll dice. -->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d100f; }
[hidden] { display: none !important; }

/* ---------- the mockup's own controls (not part of the design) ---------- */
#mock { position: fixed; z-index: 100; top: 6px; left: 6px; font: 12px/1.3 system-ui, sans-serif; color: #ddd; max-width: calc(100vw - 12px); }
#mock summary { cursor: pointer; background: #000c; border: 1px solid #555; border-radius: 6px; padding: 4px 8px; list-style: none; width: max-content; }
#mock[open] summary { border-radius: 6px 6px 0 0; }
#mock .box { background: #000e; border: 1px solid #555; padding: 8px; border-radius: 0 6px 6px 6px; display: grid; gap: 6px; max-width: 360px; }
#mock .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#mock .grp b { width: 64px; font-weight: 600; color: #aaa; }
#mock button { font: inherit; color: #ddd; background: #222; border: 1px solid #555; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
#mock button.on { background: #ddd; color: #111; }
#mock p { margin: 0; color: #999; }
body.bare #mock { display: none; }

#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

/* ---------- themes: tokens copied from packages/client/themes.js ---------- */
.frame { --bg: #1d2622; --panel: #26322dee; --panel-solid: #26322d; --panel-2: #31403a; --ink: #efe9d8; --muted: #a9b3a6; --accent: #d7a84a; --accent-ink: #1d2622; --line: #4a5a52; --good: #7fc48a; --bad: #e0685a;
  --display: 'Vollkorn SC', Georgia, serif; --body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --radius: 6px;
  --g1: #6f8f55; --g2: #4f7446; --tree: #2f5a35; --rock: #77736a; --party: #e6dcc0; --foe: #8c2f2a; --move: rgba(242, 204, 89, .26);
  --die: #c99a3e; --die-ink: #2a1d08; --die-edge: #f3d68a; --scrim: rgba(10, 14, 12, .55); }
.frame[data-theme=sunlit] { --bg: #8fd0e8; --panel: #fffdf4f2; --panel-solid: #fffdf4; --panel-2: #eef4dc; --ink: #23412f; --muted: #5f7a68; --accent: #2f9e6b; --accent-ink: #fff; --line: #c9dab5; --good: #2f9e6b; --bad: #d9483b;
  --display: 'Baloo 2', 'Trebuchet MS', sans-serif; --body: 'Nunito', 'Segoe UI', system-ui, sans-serif; --radius: 14px;
  --g1: #8ed65a; --g2: #58b558; --tree: #2f8f4c; --rock: #a89b84; --party: #ffffff; --foe: #d9483b; --move: rgba(255, 255, 255, .34);
  --die: #2f9e6b; --die-ink: #fff; --die-edge: #fff; --scrim: rgba(35, 65, 47, .35); }
.frame[data-theme=pocket] { --bg: #c7e8c1; --panel: #2b2d42f2; --panel-solid: #2b2d42; --panel-2: #3a3d5c; --ink: #f8f7ff; --muted: #b8b8d1; --accent: #ffd23f; --accent-ink: #2b2d42; --line: #545880; --good: #8be28b; --bad: #ff6b6b;
  --display: 'Silkscreen', 'Courier New', monospace; --body: 'Nunito', 'Segoe UI', system-ui, sans-serif; --radius: 2px;
  --g1: #9bdc7c; --g2: #6cc070; --tree: #3f9a5a; --rock: #b9a98f; --party: #2b2d42; --foe: #ff6b6b; --move: rgba(255, 217, 64, .34);
  --die: #ffd23f; --die-ink: #2b2d42; --die-edge: #2b2d42; --scrim: rgba(43, 45, 66, .45); }

/* ---------- the frame ---------- */
.frame { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.35 var(--body); flex: none; transform-origin: center; }
.frame.phone { width: 390px; height: 844px; }
.frame.desktop { width: 1280px; height: 800px; }
.frame button { font: inherit; color: inherit; cursor: pointer; }
.frame :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* the map (stands in for the 3D view) */
.map { position: absolute; inset: 0; }
.map svg { width: 100%; height: 100%; display: block; }
.map .nm { font: 700 13px var(--body); fill: #fff; paint-order: stroke; stroke: #000a; stroke-width: 3px; text-anchor: middle; }

/* the token */
.token { position: absolute; z-index: 20; bottom: 18px; left: 50%; width: 68px; height: 68px; margin-left: -34px; padding: 0; border: 0; background: none; border-radius: 50%; }
.token.right { left: auto; right: 18px; margin: 0; } .token.left { left: 18px; margin: 0; }
.token svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 3px 6px #0007); }
.token .disc { fill: var(--panel-solid); stroke: var(--line); stroke-width: 1.5; }
.token .hp { fill: none; stroke: var(--good); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 34px 34px; }
.token .hp.low { stroke: var(--bad); }
.token .turnring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.token.mine .turnring { opacity: 1; }
.token.pulse .turnring { animation: pulse 1.1s ease-out 2; transform-origin: 34px 34px; }
@keyframes pulse { 0% { transform: scale(1); opacity: 1; } 70% { transform: scale(1.35); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.token .badge { position: absolute; top: -2px; right: -2px; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--bad); color: #fff; font: 700 13px/22px var(--body); text-align: center; }
.frame.offline .token { filter: grayscale(1); opacity: .6; }

/* the turn line */
.turnline { position: absolute; z-index: 19; left: 50%; transform: translateX(-50%); bottom: 94px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 8px #0005; }
.turnline span { overflow: hidden; text-overflow: ellipsis; padding: 8px 0; }
.turnline button { min-height: 40px; border-radius: 999px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-2); }
.turnline button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.turnline.plain { padding-right: 14px; }

/* the banner */
.banner { position: absolute; z-index: 21; top: 22%; left: 50%; transform: translateX(-50%); font: 700 30px var(--display); color: var(--ink); background: var(--panel); border: 2px solid var(--accent);
  padding: 10px 26px; border-radius: var(--radius); pointer-events: none; white-space: nowrap; box-shadow: 0 6px 20px #0006; }
.banner.show { animation: bannerIn 1.6s ease both; }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -10px); } 15%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.frame.appear .banner.show { animation: bannerFlat 1.6s steps(1) both; }
@keyframes bannerFlat { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }

/* the scrim / clear zone */
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .7s; border: 0; padding: 0; width: 100%; }
.scrim.on { opacity: 1; pointer-events: auto; }
.scrim .tip { position: absolute; top: 18px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; }
.frame.desktop .scrim .tip { top: auto; bottom: 110px; left: 1020px; right: 0; text-align: center; padding-left: 0; }
.frame.appear .scrim { transition: none; }

/* ---------- the menu ---------- */
.menu { position: absolute; z-index: 40; color: var(--ink); }
/* phone: a sheet from the bottom */
.frame.phone .menu { left: 0; right: 0; bottom: 0; height: calc(100% - 96px); background: var(--panel-solid); border-radius: 16px 16px 0 0; border-top: 1px solid var(--line);
  box-shadow: 0 -8px 30px #0007; transform: translateY(105%); visibility: hidden; transition: transform .66s ease-in-out, visibility 0s .66s; display: flex; flex-direction: column; overflow: hidden; }
.frame.phone .menu.open { transform: none; visibility: visible; transition: transform .72s cubic-bezier(.2,.8,.25,1); }
.frame.phone .menu .handle { flex: none; height: 22px; display: flex; justify-content: center; align-items: center; border: 0; background: none; width: 100%; padding: 0; }
.frame.phone .menu .handle i { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.frame.phone .levels { position: relative; flex: 1; overflow: hidden; }
.frame.phone .level { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--panel-solid); transition: transform .68s cubic-bezier(.2,.8,.25,1), opacity .68s; }
.frame.phone .level.behind { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.frame.phone .level.ahead { transform: translateX(100%); pointer-events: none; }
/* desktop: columns from the left */
.frame.desktop .menu .handle { display: none; }
.frame.desktop .menu { top: 0; bottom: 0; left: 0; display: flex; pointer-events: none; }
.frame.desktop .levels { display: flex; height: 100%; }
.frame.desktop .level { height: 100%; display: flex; flex-direction: column; background: var(--panel-solid); border-right: 1px solid var(--line); pointer-events: auto; box-shadow: 6px 0 18px #0004;
  transform: translateX(-110%); opacity: 0; transition: transform .66s ease-in-out, opacity .66s; }
.frame.desktop .level.shown { transform: none; opacity: 1; transition: transform .7s cubic-bezier(.2,.8,.25,1), opacity .7s; }
.frame.desktop .level.w1 { width: 250px; } .frame.desktop .level.w2 { width: 420px; } .frame.desktop .level.w3 { width: 360px; }
.frame.desktop .level.cur { box-shadow: 6px 0 22px #0006; }
.frame.appear .menu, .frame.appear .level { transition: none !important; }

.lhead { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 10px 6px; border-bottom: 1px solid var(--line); min-height: 52px; }
.lhead .back { min-height: 44px; min-width: 44px; border: 0; background: none; color: var(--muted); padding: 0 8px; font-size: 15px; }
.lhead h2 { margin: 0; font: 700 20px var(--display); flex: 1; }
.lhead .close { min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); font-size: 20px; }
.lbody { flex: 1; overflow: auto; padding: 6px 10px 18px; }
.frame.desktop .lbody { padding-bottom: 24px; }
.sec { font: 700 12px var(--body); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 14px 4px 4px; }

.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; text-align: left; padding: 8px 10px; margin: 4px 0; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 700; }
.row .t small { display: block; color: var(--muted); font-size: 13px; }
.row .r { color: var(--muted); font-size: 13px; text-align: right; }
.row .chev { color: var(--muted); font-size: 20px; }
.row.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.row.grey { opacity: .55; }
.row.grey .t small.why { color: var(--ink); opacity: 1; }
.row .chip { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; color: var(--muted); white-space: nowrap; }
.row.char { min-height: 72px; }
.sigil { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 700 22px var(--display); border: 2px solid var(--die-edge); }
.like { margin: -2px 0 6px 16px; }
.like .row { min-height: 48px; border-style: dashed; }
.subtle { color: var(--muted); font-size: 13px; margin: 6px 4px; }

/* status block */
.status { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.status .top { display: flex; align-items: center; gap: 10px; }
.status .top .who { flex: 1; min-width: 0; }
.status .top .who b { font: 700 19px var(--display); }
.status .top .who small { color: var(--muted); display: block; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.hpbar { display: flex; align-items: center; gap: 10px; margin: 8px 0 6px; font-size: 14px; }
.hpbar .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.hpbar .bar i { display: block; height: 100%; background: var(--good); }
.turnbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 6px 0; }
.turnbar button { min-height: 48px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); padding: 2px; line-height: 1.1; }
.turnbar button b { display: block; font-size: 13px; }
.turnbar button small { font-size: 12px; color: var(--good); }
.turnbar button.used small { color: var(--muted); }
.turnbar button.used b { text-decoration: line-through; opacity: .7; }
.turnbar button.off small { color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.pills span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.saves { font-size: 20px; letter-spacing: 4px; margin: 4px 0; }

/* aim bar, throw zone, prompts */
.dock { position: absolute; z-index: 50; left: 8px; right: 8px; bottom: 8px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: 0 -4px 22px #0007;
  transform: translateY(130%); visibility: hidden; transition: transform .2s ease-out, visibility 0s .2s; }
.frame.desktop .dock { left: 50%; right: auto; width: 520px; margin-left: -260px; }
.dock.open { transform: none; visibility: visible; transition: transform .2s ease-out; }
.frame.appear .dock { transition: none; }
.dock h3 { margin: 0 0 4px; font: 700 18px var(--display); }
.dock p { margin: 2px 0; }
.dock .warn { color: var(--bad); }
.dock .acts { display: flex; gap: 8px; margin-top: 10px; }
.dock .acts .btn { flex: 1; min-height: 48px; }
.throwpad { position: relative; height: 150px; display: grid; place-items: center; touch-action: none; }
.throwpad .hint { position: absolute; bottom: 0; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 13px; }
.pdie { width: 96px; height: 96px; touch-action: none; cursor: grab; border: 0; background: none; padding: 0; }
.pdie svg, .fdie svg { width: 100%; height: 100%; overflow: visible; }
.pdie.held { transform: scale(1.1); filter: drop-shadow(0 8px 10px #0008); }
.die-f { fill: var(--die); stroke: var(--die-edge); stroke-width: 2.5; stroke-linejoin: round; }
.die-l { fill: none; stroke: var(--die-edge); stroke-width: 1.4; opacity: .7; }
.die-n { font: 800 28px var(--body); fill: var(--die-ink); text-anchor: middle; dominant-baseline: central; }
.dice-layer { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
.fdie { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; }
.dtitle { position: absolute; z-index: 46; left: 50%; transform: translateX(-50%); top: 74px; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid #4f7fc0; border-radius: var(--radius);
  padding: 8px 14px; min-width: 260px; max-width: calc(100% - 24px); box-shadow: 0 4px 14px #0006; pointer-events: auto; }
.dtitle b { display: block; font: 700 17px var(--display); }
.dtitle .res { font-size: 15px; }
.dtitle .cd { height: 3px; background: var(--accent); margin-top: 6px; border-radius: 2px; transform-origin: left; }
.dtitle ol { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.dtitle ol .me { color: var(--ink); font-weight: 700; }
.trail { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: .5; pointer-events: none; margin: -4px 0 0 -4px; }

.question { position: absolute; z-index: 60; left: 8px; right: 8px; bottom: 8px; background: var(--panel-solid); border: 2px solid var(--accent); border-radius: 14px; padding: 14px; box-shadow: 0 -6px 26px #0008;
  transform: translateY(130%); visibility: hidden; transition: transform .22s ease-out, visibility 0s .22s; }
.frame.desktop .question { left: 50%; right: auto; width: 480px; margin-left: -240px; }
.question.open { transform: none; visibility: visible; transition: transform .22s ease-out; }
.frame.appear .question { transition: none; }
.question h3 { margin: 0 0 6px; font: 700 20px var(--display); }
.question .acts { display: grid; gap: 8px; margin-top: 10px; }
.question .acts .btn { min-height: 52px; }
.qscrim { position: absolute; inset: 0; z-index: 55; background: var(--scrim); }

.toast { position: absolute; z-index: 70; top: 14px; left: 50%; transform: translateX(-50%); background: var(--panel-solid); border: 1px solid var(--line); padding: 8px 14px; border-radius: var(--radius); font-size: 14px; box-shadow: 0 3px 10px #0006; white-space: nowrap; }

.tracker .trow { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border-left: 4px solid var(--line); background: var(--panel-2); margin: 4px 0; border-radius: var(--radius); }
.tracker .trow.cur { border-left-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tracker .trow .init { width: 30px; text-align: center; font-weight: 700; }
.tracker .trow .n { flex: 1; } .tracker .trow .n small { display: block; color: var(--muted); font-size: 12px; }
.tracker .trow .h { font-size: 13px; color: var(--muted); }
.tracker .trow.foe { border-left-color: var(--bad); }
.tracker .trow.dead .n b { text-decoration: line-through; opacity: .6; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
.seg button { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.setl { margin: 10px 4px 2px; font-weight: 700; font-size: 14px; }
.roll { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); border-left: 6px solid #4f7fc0; border-radius: var(--radius); margin: 4px 0; }
.roll .t { flex: 1; } .roll .t small { display: block; color: var(--muted); }
.roll .faces { font-weight: 800; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.log li { margin: 6px 0; } .log { padding-left: 18px; }
.say { display: flex; gap: 6px; margin-top: 10px; } .say input { flex: 1; min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: var(--radius); padding: 0 10px; font: inherit; }
/* round 2 */
.token .hplabel { position: absolute; left: 74px; top: 20px; white-space: nowrap; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font: 600 14px var(--body); color: var(--ink); box-shadow: 0 2px 8px #0005; }
.token.right .hplabel { left: auto; right: 74px; }
.waitbox { border: 2px solid var(--accent); border-radius: var(--radius); padding: 8px 10px; margin: 6px 0 10px; background: var(--panel); }
.waitbox h3 { margin: 0 0 4px; font: 700 15px var(--body); }
.waitbox .w { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.waitbox .w span { flex: 1; }
.note { border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px 10px; margin: 6px 0; display: flex; gap: 8px; align-items: center; font-size: 14px; }
.note span { flex: 1; }
.sigil { position: relative; }
.sring { position: absolute; inset: -6px; width: 60px; height: 60px; }
.sring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
.row.char.sub { margin-left: 22px; width: calc(100% - 22px); min-height: 64px; }
.row.char.sub .sigil { width: 38px; height: 38px; font-size: 17px; }
.row.char.sub .sring { width: 50px; height: 50px; }
.row[aria-expanded] .chev { transition: transform .3s; }
.row[aria-expanded=true] .chev { transform: rotate(90deg); }
.fold { margin: 0 0 8px 10px; padding-left: 8px; border-left: 2px solid var(--line); }
.dpick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.dpick button { min-height: 56px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); display: grid; place-items: center; line-height: 1.1; padding: 4px; }
.dpick button b { font-size: 15px; } .dpick button small { color: var(--accent); font-weight: 700; font-size: 12px; }
.dpick button.n { border-color: var(--accent); }
.step { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.step button { min-width: 48px; min-height: 48px; border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--radius); font-size: 20px; }
.step output { min-width: 40px; text-align: center; font-weight: 700; font-size: 18px; }
.preview { display: flex; align-items: center; gap: 14px; margin: 8px 0; }
.preview .pv { width: 72px; height: 72px; animation: turn 9s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.frame.appear .preview .pv { animation: none; }
.seg button[aria-disabled=true] { opacity: .4; }

  transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.25,1) calc(var(--i) * 25ms), opacity .4s calc(var(--i) * 25ms); }

.alab { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 12px/1.2 var(--body); color: var(--ink); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 7px; opacity: 0; transition: opacity .35s; pointer-events: none; }

.scrim.light { background: color-mix(in srgb, var(--scrim) 70%, transparent); }

.ntile { flex: none; min-width: 48px; height: 48px; border-radius: var(--radius); border: 1px solid transparent; background: none; color: var(--icon); display: grid; place-items: center; padding: 0 2px; }
.ntile.on { background: var(--panel-2); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.ntile .sigil { width: 34px; height: 34px; font-size: 15px; } .ntile .sigil .sring { width: 44px; height: 44px; inset: -5px; }

.frame.phone .menu .handle { height: 44px; }

.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.arow.off { opacity: .5; } .arow.dragging { position: relative; z-index: 2; box-shadow: 0 6px 18px #0008; border-color: var(--accent); }
.arow .grip { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; }
.arow .grip .ico { width: 22px; height: 22px; }

<body>
<details id="mock" open>
  <summary>Mockup controls (not the design)</summary>
  <div class="box">
    <div class="grp"><b>Frame</b><button data-k="frame" data-v="phone">Phone 390</button><button data-k="frame" data-v="desktop">Desktop 1280</button></div>
    <div class="grp"><b>Theme</b><button data-k="theme" data-v="classic">Classic</button><button data-k="theme" data-v="sunlit">Sunlit</button><button data-k="theme" data-v="pocket">Pocket</button></div>
    <div class="grp"><b>State</b><button data-k="state" data-v="explore">Exploring</button><button data-k="state" data-v="other">Another's turn</button><button data-k="state" data-v="mine">My turn</button><button data-k="state" data-v="down">Down</button></div>
    <div class="grp"><b>Plays</b><button data-k="chars" data-v="one">One character</button><button data-k="chars" data-v="familiar">Wren + familiar</button><button data-k="chars" data-v="solo">Solo party</button></div>
    <div class="grp"><b>Arrives</b><button data-do="handout">A handout</button><button data-do="hit">Wren is hit</button><button data-do="reaction">A reaction question</button><button data-do="initiative">Initiative</button></div>
    <div class="grp"><b>Menu</b><button data-do="arc">Tap the die</button><button data-do="hold">Hold the die</button><button data-do="symbols">Symbols</button><button data-k="token" data-v="left">Die left</button><button data-k="token" data-v="centre">centre</button><button data-k="token" data-v="right">right</button></div>

    <p>Tap the die to open the menu; tap the dimmed map to clear it. Press and hold the die: Roll dice. Character › Cast › Burning Hands aims; Fire Bolt throws. Drag, spin and fling a die.</p>

<div id="symbols" hidden></div>
<div id="stage">
  <div class="frame phone" id="frame" data-theme="classic">

      <svg viewBox="0 0 68 68" aria-hidden="true">
        <circle class="disc" cx="34" cy="34" r="31"/>
        <circle class="turnring" cx="34" cy="34" r="33"/>
        <circle class="hp" id="hparc" cx="34" cy="34" r="31" pathLength="100" stroke-dasharray="75 100"/>
        <g transform="translate(34 34)">
          <polygon class="die-f" points="0,-21 18,-10.5 18,10.5 0,21 -18,10.5 -18,-10.5"/>
          <polyline class="die-l" points="0,-21 -10,6 10,6 0,-21"/><polyline class="die-l" points="-18,-10.5 -10,6 0,21 10,6 18,-10.5"/>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const F = $('frame');
const DEFAULT_ORDER_INIT = ['chars-mine', 'turns', 'dice', 'roll', 'log', 'handouts', 'setup', 'dm', 'chars', 'packs', 'help', 'about', 'leave'];
const ST = { frame: 'phone', theme: 'classic', state: 'mine', motion: 'slide', rule: 'auto', hold: '3', token: 'centre', path: [], open: false,
  aiming: null, dice: [], bar: { action: true, bonus: true, move: 30, reaction: true }, initShown: true, autoOpen: false, flick: true,
  chars: 'familiar', sel: 'wren', waiting: [], seenRing: false, folds: new Set(), scroll: {}, look: 'tblue', dieCol: 'red', numCol: 'yellow',
  pick: { 20: 1 }, mod: 0, rollTo: 'table', rollFor: '', bars: 'always', foeHealth: 'rough', order: [...DEFAULT_ORDER_INIT], hiddenItems: new Set(), alwaysLabels: false, arcOpen: false, lastPool: null };

// ---------- made-up creatures ----------
const CH = {
  wren: { id: 'wren', name: 'Wren', sub: 'Level 1 Wizard', hp: 6, max: 8, ac: 12, speed: 30, col: '#c96a3a', letter: 'W' },
  owl: { id: 'owl', name: 'Owl', sub: 'Wren’s familiar', hp: 1, max: 1, ac: 11, speed: 60, col: '#8a7a5a', letter: 'O', master: 'wren' },
  brenna: { id: 'brenna', name: 'Brenna', sub: 'Level 1 Fighter', hp: 12, max: 12, ac: 18, speed: 30, col: '#b84a3a', letter: 'B' },
  pip: { id: 'pip', name: 'Pip', sub: 'Level 1 Rogue', hp: 7, max: 10, ac: 14, speed: 30, col: '#4f9a6a', letter: 'P' },
  odessa: { id: 'odessa', name: 'Odessa', sub: 'Level 1 Cleric', hp: 10, max: 10, ac: 16, speed: 30, col: '#d0a030', letter: 'O' },
  tavin: { id: 'tavin', name: 'Tavin', sub: 'Level 1 Warlock', hp: 8, max: 8, ac: 13, speed: 30, col: '#4f7fc0', letter: 'T' },
};
const mineList = () => ({ one: ['wren'], familiar: ['wren', 'owl'], solo: ['wren', 'brenna', 'pip', 'odessa', 'tavin'] })[ST.chars];
const sel = () => CH[ST.sel];
const ORDER = [
  { n: 'Odessa', init: 20, side: 'party', hp: '10 / 10' }, { n: 'Wren', init: 17, side: 'party', hp: '6 / 8', you: true },
  { n: 'Goblin Warrior 3', side: 'foe', hp: 'Healthy' }, { n: 'Tavin', init: 15, side: 'party', hp: '8 / 8' },
  { n: 'Wolf 1', side: 'foe', hp: 'Bloodied' }, { n: 'Pip', init: 11, side: 'party', hp: '7 / 10' },
  { n: 'Something moves unseen', side: 'unseen' }, { n: 'Goblin Warrior 2', side: 'foe', hp: 'Healthy' }, { n: 'Brenna', init: 6, side: 'party', hp: '12 / 12' }];

// ---------- dice looks (Decision 8a) ----------
const LOOKS = {
  tblue: { name: 'Translucent blue', free: true, fill: '#2f7fe0', op: .55, num: '#ffffff', edge: '#bfe0ff', clear: true },
  white: { name: 'White', free: true, fill: '#f4f1e8', op: 1, num: '#111111', edge: '#b9b4a6' },
  black: { name: 'Black', free: true, fill: '#1c1c1c', op: 1, num: '#ffffff', edge: '#5a5a5a' },
  red: { name: 'Red', free: true, fill: '#c62828', op: 1, num: '#ffffff', edge: '#ef9a9a' },
  blue: { name: 'Blue', free: true, fill: '#1e4fbf', op: 1, num: '#ffffff', edge: '#90b4ff' },
  green: { name: 'Green', free: true, fill: '#2e7d32', op: 1, num: '#ffffff', edge: '#a5d6a7' },
  yellow: { name: 'Yellow', free: true, fill: '#f2c200', op: 1, num: '#111111', edge: '#8a6d00' },
  primary: { name: 'Primary colours, your way', free: true },
};
const PRIM = { red: '#d32f2f', yellow: '#fbc02d', blue: '#1e4fbf', white: '#f7f7f7', black: '#161616' };
const UNREADABLE = (d, n) => d === n || (d === 'yellow' && n === 'white') || (d === 'white' && n === 'yellow') || (d === 'black' && n === 'blue') || (d === 'blue' && n === 'black') || (d === 'red' && n === 'black') || (d === 'black' && n === 'red');
function lookOf() {
  if (ST.look !== 'primary') return LOOKS[ST.look];
  return { fill: PRIM[ST.dieCol], op: 1, num: PRIM[ST.numCol], edge: ST.dieCol === 'white' ? '#999' : '#ffffff99' };
}
// a die drawn as a flat-shaded solid: d4 triangle, d6 square, d8 diamond, d10 kite, d12 pentagon, d20 hexagon
const SHAPES = {
  4: { pts: '0,-24 22,16 -22,16', lines: '' },
  6: { pts: '-19,-19 19,-19 19,19 -19,19', lines: '<polyline points="-19,-19 -12,-12 12,-12 19,-19"/><polyline points="12,-12 12,12 19,19"/>' },
  8: { pts: '0,-25 22,0 0,25 -22,0', lines: '<polyline points="-22,0 22,0"/>' },
  10: { pts: '0,-25 21,-4 13,18 -13,18 -21,-4', lines: '<polyline points="-21,-4 0,6 21,-4"/><polyline points="0,6 0,-25"/>' },
  12: { pts: '0,-24 22,-7 14,20 -14,20 -22,-7', lines: '<polygon points="0,-13 11,-4 7,10 -7,10 -11,-4"/>' },
  20: { pts: '0,-24 21,-12 21,12 0,24 -21,12 -21,-12', lines: '<polyline points="0,-24 -12,7 12,7 0,-24"/><polyline points="-21,-12 -12,7 0,24 12,7 21,-12"/>' },
};
function dieSvg(sides, n, { numA = 1, look = lookOf(), size = 26, others = [], othersA = 0, topScale = 1 } = {}) {
  const sh = SHAPES[sides === 100 ? 10 : sides] ?? SHAPES[20];
  const back = look.clear ? `<g fill="none" stroke="${look.edge}" stroke-opacity=".35" stroke-width="1"><polyline points="-21,12 0,0 21,12"/><polyline points="0,0 0,24"/></g>` : '';
  return `<svg viewBox="-28 -28 56 56" aria-hidden="true"><polygon points="${sh.pts}" fill="${look.fill}" fill-opacity="${look.op}" stroke="${look.edge}" stroke-width="2" stroke-linejoin="round"/>${back}
    <g fill="none" stroke="${look.edge}" stroke-width="1.2" stroke-opacity=".75">${sh.lines}</g>
    ${look.clear ? '<polygon points="-15,-14 -3,-21 -9,-11" fill="#fff" fill-opacity=".35"/>' : ''}
    ${othersA > .01 ? others.map((o) => `<text x="${o.x}" y="${o.y}" text-anchor="middle" dominant-baseline="central" style="font:700 ${size * .26}px system-ui,sans-serif" fill="${look.num}" fill-opacity="${othersA * .8}">${o.v}</text>`).join('') : ''}
    <text x="0" y="${sides === 4 ? 6 : 2}" text-anchor="middle" dominant-baseline="central" transform="scale(${topScale})" style="font:800 ${size * .62}px system-ui,sans-serif" fill="${look.num}" fill-opacity="${numA}">${n ?? ''}</text></svg>`;
}

// ---------- a stand-in for the engine's seeded dice (the real roll comes from the game state's seed) ----------
let seed = 20261119;
const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
const engineDie = (sides) => 1 + Math.floor(rnd() * sides);

// ---------- the map ----------
function drawMap() {
  const W = ST.frame === 'phone' ? 390 : 1280, H = ST.frame === 'phone' ? 844 : 800;
  const cx = W * (ST.frame === 'phone' ? .5 : .62), cell = ST.frame === 'phone' ? 52 : 64;
  let s = `<svg viewBox="0 0 ${W} ${H}" aria-label="The map"><rect width="${W}" height="${H}" fill="var(--g1)"/>`;
  const rows = 16, top = -40;
  const yAt = (r) => top + Math.pow(r / rows, 1.15) * (H + 120);
  const half = (r) => (W * .55) + r * cell * .9;
  const xAt = (c, r) => cx + c * (half(r) * 2 / 17.5);
  for (let r = 0; r < rows; r++) {
    const y0 = yAt(r), y1 = yAt(r + 1);
    for (let c = -14; c < 14; c++) {
      const pts = [[xAt(c, r), y0], [xAt(c + 1, r), y0], [xAt(c + 1, r + 1), y1], [xAt(c, r + 1), y1]];
      const forest = ((r * 7 + c * 13) % 11 === 0) || ((r * 3 + c * 5) % 17 === 0);
      const reach = ST.state === 'mine' && !ST.aiming && c >= -2 && c <= 2 && r >= 7 && r <= 10;
      s += `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${forest ? 'var(--g2)' : 'var(--g1)'}" stroke="#0002" stroke-width="1"/>`;
      if (reach) s += `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="var(--move)"/>`;
      if (forest) { const mx = (pts[0][0] + pts[2][0]) / 2, my = (pts[0][1] + pts[2][1]) / 2, k = (y1 - y0) / 40;
        s += `<polygon points="${mx},${my - 30 * k} ${mx - 13 * k},${my + 4 * k} ${mx + 13 * k},${my + 4 * k}" fill="var(--tree)"/>`; }
    }
  }
  if (ST.state === 'mine' && !ST.aiming) s += `<polygon points="${xAt(-2, 7)},${yAt(7)} ${xAt(3, 7)},${yAt(7)} ${xAt(3, 11)},${yAt(11)} ${xAt(-2, 11)},${yAt(11)}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-opacity=".85"/>`;
  if (ST.aiming?.locked) { const y0 = yAt(4.5), y1 = yAt(8.5), xm = cx + 20;
    s += `<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(255,120,50,.35)"/><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,.5)" stroke-width="2"/></pattern></defs>`;
    s += `<polygon points="${xm},${y1} ${xm - 150},${y0} ${xm + 150},${y0}" fill="url(#hatch)" stroke="var(--ink)" stroke-width="2"/>`; }
  // boulders: a lumpy outline, lit from the top left, with a shadow on the grass (the map is a stand-in for the 3D view)
  const rock = (x, y, w) => { const h = w * .62, p = (a, b) => `${x + a * w},${y + b * h}`;
    return `<g><ellipse cx="${x + w * .55}" cy="${y + h * .98}" rx="${w * .6}" ry="${h * .22}" fill="#0004"/>
      <path d="M${p(.05, .85)} C${p(-.05, .45)} ${p(.15, .1)} ${p(.42, .06)} C${p(.62, -.04)} ${p(.95, .12)} ${p(1.0, .5)} C${p(1.05, .8)} ${p(.85, 1.0)} ${p(.55, .98)} C${p(.35, 1.02)} ${p(.12, 1.0)} ${p(.05, .85)} Z" fill="url(#rockg)" stroke="#0005" stroke-width="1.5"/>
      <path d="M${p(.25, .3)} C${p(.35, .18)} ${p(.5, .16)} ${p(.6, .22)}" fill="none" stroke="#fff3" stroke-width="3" stroke-linecap="round"/>
      <path d="M${p(.55, .55)} L${p(.68, .78)}" stroke="#0003" stroke-width="2"/></g>`; };
  s += `<defs><radialGradient id="rockg" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#b8b3a6"/><stop offset=".55" stop-color="var(--rock)"/><stop offset="1" stop-color="#4c4a44"/></radialGradient></defs>`;
  s += rock(cx - 170, yAt(3), 70) + rock(cx + 120, yAt(10), 80);
  // health bars over every creature (Decision 7a): the party's exact; a foe's by the table's rule (rough: full, half for Bloodied, empty)
  const showBars = ST.bars === 'always' || (ST.bars === 'fight' && fight());
  const bar = (x, y, hp, foe) => {
    if (!showBars || hp == null) return '';
    const f = typeof hp === 'number' ? hp : { healthy: 1, bloodied: .5, down: 0 }[hp];
    const rough = typeof hp === 'string';

    title: () => 'You (Wren): Initiative', res: (f) => `${f[0]} · 2nd of 9`,
    list: () => `<ol><li>Odessa 20</li><li class="me">▶ Wren 17 (you)</li><li>Goblin Warrior 3</li><li>Tavin 15</li><li>Wolf 1</li><li>Pip 11</li><li>Something moves unseen</li><li>Goblin Warrior 2</li><li>Brenna 6</li></ol>`,
    after: () => { ST.initShown = true; renderHud(); } }), ST.open ? 250 : 0);
}
function reaction() {
  const wasOpen = ST.open;
  if (wasOpen) { openMenu(false); toast('The menu folds away; the question comes first.'); }
  setTimeout(() => {
    $('qscrim').hidden = false; const q = $('question');
    q.innerHTML = `<h3>Use a reaction?</h3><p>Goblin Warrior 2 hits Wren with a Scimitar: 17 against AC 12.</p><div class="acts"><button type="button" class="btn go" data-act="answer:Shield">Use Shield (level 1 slot) · AC 17, the hit misses</button><button type="button" class="btn" data-act="answer:no">Do not react</button></div>`;
    q.classList.add('open'); q.querySelector('button').focus({ preventScroll: true });
  }, wasOpen && ST.motion !== 'appear' ? 700 : 0);
}

// ---------- taps ----------
F.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-go],[data-act],[data-back],[data-close],[data-set],[data-fold]'); if (!b) return;
  if (b.getAttribute('aria-disabled') === 'true') { if (b.title) toast(b.title); return; }
  if (b.dataset.close) return openMenu(false);
  if (b.dataset.back) { ST.path.pop(); renderMenu(); return; }
  if (b.dataset.set) { const [k, v] = b.dataset.set.split('='); ST[k] = v === 'true' ? true : v === 'false' ? false : v; syncMock(); renderHud(); return; }
  if (b.dataset.fold) { const k = b.dataset.fold; ST.folds.has(k) ? ST.folds.delete(k) : ST.folds.add(k); renderMenu(); return; }   // opens in place: nothing scrolls
  if (b.dataset.go) { if (b.closest('.turnline')) { ST.path = ['turns']; openMenu(true); return; } return go(b.dataset.go); }
  const a = b.dataset.act;
  if (a.startsWith('toast:')) return toast(a.slice(6));
  if (a === 'seen') { ST.seenRing = true; if (ST.arcOpen) { $('arc').querySelector('.arccards')?.remove(); if (ST.waiting.length) openArc(true); return; } return renderMenu(); }
  if (a.startsWith('wait:')) { const w = ST.waiting.splice(Number(a.slice(5)), 1)[0]; if (ST.arcOpen) openArc(false); ST.path = [w.go]; renderHud(); return openMenu(true); }
  if (a.startsWith('add:')) { const sd = a.slice(4);
    if (ev.shiftKey) return subDie(sd);                                     // Shift+click takes one away
    if (diceCount() >= 20) return toast('At most 20 dice in one roll.');
    ST.pick[sd] = (ST.pick[sd] ?? 0) + 1; return renderMenu(); }
  if (a.startsWith('sub:')) return subDie(a.slice(4));
  if (a === 'modzero') { ST.mod = 0; return renderMenu(); }
  if (a === 'clearpick') { ST.pick = {}; ST.mod = 0; return renderMenu(); }
  if (a.startsWith('mod:')) { ST.mod = Math.max(-10, Math.min(10, ST.mod + Number(a.slice(4)))); return renderMenu(); }
  if (a === 'rollpick') { ST.lastPool = { pick: { ...ST.pick }, mod: ST.mod }; return rollPicked(); }
  if (a === 'resetorder') { ST.order = [...DEFAULT_ORDER]; ST.hiddenItems.clear(); toast('Order reset.'); return renderMenu(); }
  if (a === 'aim') return aim();
  if (a === 'firebolt') return fireBolt();
  if (a === 'cancelaim') return endAim();
  if (a === 'cast') { endAim(); throwCtx = { dice: [6, 6, 6], known: true, title: () => 'You (Wren): Burning Hands damage', res: (f, t) => `${f.join(' + ')} = ${t} fire · Goblin Warrior 2 and 3 save (Dexterity)`, after: () => { ST.bar.action = false; } }; return release(null); }
  if (a === 'canceltz') return closeThrow();
  if (a === 'dash') { ST.bar.action = false; ST.bar.move = 60; renderMenu(); return toast('Dashed: 60 ft to move.'); }
  if (a === 'endturn') { ST.state = 'other'; openMenu(false); syncMock(); renderHud(); return toast('Turn ended. Goblin Warrior 2’s turn.'); }
  if (a.startsWith('answer:')) { $('question').classList.remove('open'); $('qscrim').hidden = true; if (a === 'answer:Shield') ST.bar.reaction = false; renderHud(); return toast(a === 'answer:Shield' ? 'Shield: AC 17 until your next turn. The hit misses.' : 'You did not react.'); }
});
// the token: a quick tap fans the symbols out round it (or closes what is open); held for a second it throws your last roll
let pressT = null, pressed = false;
$('token').addEventListener('pointerdown', () => { pressed = false; clearTimeout(pressT); $('token').classList.remove('lift');
  pressT = setTimeout(() => { pressed = true; $('token').classList.add('lift'); quickRoll(); setTimeout(() => $('token').classList.remove('lift'), 300); }, 1000); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((e) => $('token').addEventListener(e, () => clearTimeout(pressT)));
$('token').addEventListener('contextmenu', (ev) => ev.preventDefault());
$('token').addEventListener('click', (ev) => {
  ev.stopPropagation(); if (pressed) { pressed = false; return; }
  if (ST.open) return openMenu(false);
  openArc(!ST.arcOpen);
});
function quickRoll() {
  if (ST.open) openMenu(false); if (ST.arcOpen) openArc(false);
  const pool = ST.lastPool ?? { pick: { 20: 1 }, mod: 0 }, dice = [];
  for (const [sd, n] of Object.entries(pool.pick)) for (let i = 0; i < n; i++) dice.push(Number(sd));
  const txt = Object.entries(pool.pick).map(([sd, n]) => `${n}d${sd}`).join(' + ') + (pool.mod ? ` ${pool.mod > 0 ? '+' : '−'} ${Math.abs(pool.mod)}` : '');
  const t = $('token').getBoundingClientRect(), f = F.getBoundingClientRect(), sc = f.width / F.offsetWidth;
  throwCtx = { dice, mod: pool.mod, plain: true, known: true, from: { x: (t.left + t.width / 2 - f.left) / sc, y: (t.top - f.top) / sc },
    title: () => `You (Wren): ${txt} · just for fun`, res: (fs, tot) => `${fs.join(', ')}${pool.mod ? ` ${pool.mod > 0 ? '+' : '−'} ${Math.abs(pool.mod)}` : ''} = ${tot}`,
    log: (fs, tot) => `Wren rolls ${txt} for fun: ${fs.join(', ')} = <b>${tot}</b>. (Seen by you and the DM.)` };
  release(null);
}
$('scrim').addEventListener('click', () => { if (ST.arcOpen) openArc(false); openMenu(false); });
// the grab handle closes the sheet: a tap, or a drag down past 60 px or a quick flick
let hd = null;
$('handle').addEventListener('pointerdown', (ev) => { hd = { y: ev.clientY, t: performance.now(), dy: 0 }; $('handle').setPointerCapture?.(ev.pointerId); $('menu').style.transition = 'none'; });
$('handle').addEventListener('pointermove', (ev) => { if (!hd) return; const sc = F.getBoundingClientRect().width / F.offsetWidth; hd.dy = Math.max(0, (ev.clientY - hd.y) / sc); $('menu').style.transform = `translateY(${hd.dy}px)`; });
$('handle').addEventListener('pointerup', () => { if (!hd) return; const fast = hd.dy / Math.max(1, performance.now() - hd.t) > .5; $('menu').style.transition = '';
  const close = hd.dy < 6 || hd.dy > 60 || fast; hd = null; $('menu').style.transform = ''; if (close) openMenu(false); });
$('map').addEventListener('click', () => { if (ST.aiming) { ST.aiming.locked = true; drawMap(); aimBar(); } });
// arc and strip taps; a press and hold on a symbol in the arc opens Arrange
let arcHold = null, arcHeld = false;
F.addEventListener('pointerdown', (ev) => { const t = ev.target.closest('[data-arc]'); if (!t) return; arcHeld = false; clearTimeout(arcHold);
  arcHold = setTimeout(() => { arcHeld = true; openArc(false); ST.path = ['setup', 'arrange']; openMenu(true); }, 500); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((e) => F.addEventListener(e, () => clearTimeout(arcHold)));
F.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-arc]'); if (a) { if (arcHeld) { arcHeld = false; return; } return pickPlace(a.dataset.arc); }
  const n = ev.target.closest('[data-nav]'); if (n) { const id = n.dataset.nav; if (id === 'leave') return toast('Leave the table? (asks first, then goes to the start page)'); return go(id === 'roll' ? 'dice' : id); }
  const m = ev.target.closest('[data-move]'); if (m) { const [id, d] = m.dataset.move.split(/:(?=-?\d$)/); moveItem(id, Number(d)); return renderMenu(); }
  const h = ev.target.closest('[data-hide]'); if (h) { const id = h.dataset.hide; ST.hiddenItems.has(id) ? ST.hiddenItems.delete(id) : ST.hiddenItems.add(id); return renderMenu(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.matches('input')) return;
  if (ev.key === 'm' || ev.key === 'M') { if (ST.open) openMenu(false); else openArc(!ST.arcOpen); }
  else if (ev.key === 'Escape') { if (ST.aiming) endAim(); else if (ST.arcOpen) openArc(false); else openMenu(false); }
  else if ((ev.key === 'Backspace' || ev.key === 'ArrowLeft') && ST.open && ST.path.length > 1) { ST.path.pop(); renderMenu(); }
});

// ---------- the mockup's controls and the address ----------
function syncMock() { document.querySelectorAll('#mock [data-k]').forEach((b) => b.classList.toggle('on', String(ST[b.dataset.k]) === b.dataset.v)); }
function addHandout() { ST.handouts = true; ST.waiting.push({ text: '1 new handout: A torn map', btn: 'Open', go: 'handouts', short: '1 new handout' }); renderHud(); toast('The DM showed you a handout.'); }
function hit() { CH.wren.hp = Math.max(1, CH.wren.hp - 3); ST.sel = 'wren'; renderHud(); hpLabel(); toast('Goblin Warrior 2 hits Wren: 3 slashing.'); }
document.getElementById('mock').addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.k) { const k = b.dataset.k, v = b.dataset.v, was = ST[k]; ST[k] = v;
    if (k === 'state') { ST.round1 = false; ST.bar = { action: true, bonus: true, move: 30, reaction: true }; ST.initShown = true; }
    if (k === 'chars') { if (!mineList().includes(ST.sel)) ST.sel = 'wren'; ST.path = ST.path.filter((p) => !p.startsWith('character:') || mineList().includes(p.split(':')[1])); }
    if (k === 'frame') { ST.path = ST.path.filter((p) => !p.startsWith('g:')); fit(); }
    syncMock(); renderHud(); if (k === 'state' && v === 'mine' && was !== 'mine') { banner(); if (ST.autoOpen) { ST.path = ['character:wren']; openMenu(true); } } }
  if (b.dataset.do === 'reaction') { if (ST.state === 'explore') { ST.state = 'other'; syncMock(); renderHud(); } reaction(); }
  if (b.dataset.do === 'initiative') initiative();
  if (b.dataset.do === 'handout') addHandout();
  if (b.dataset.do === 'hit') hit();
  if (b.dataset.do === 'arc') { if (ST.open) openMenu(false); openArc(true); }
  if (b.dataset.do === 'hold') quickRoll();
  if (b.dataset.do === 'symbols') symbols(!document.getElementById('symbols').hidden ? false : true);
});
function symbols(on) {
  const el = document.getElementById('symbols'); el.hidden = !on; if (!on) return;
  const ids = ['setup', 'dm', 'chars', 'packs', 'turns', 'party', 'dice', 'roll', 'log', 'handouts', 'help', 'about', 'leave', 'more', 'grip'];
  const names = { setup: 'Setup (gear)', dm: 'DM tools (wrench)', chars: 'Characters (meeples)', packs: 'Packs (a strapped tome)', turns: 'Turns (crossed swords)', party: 'Party (campfire)', dice: 'Dice (a d20)', roll: 'Roll dice (two dice)', log: 'Log and chat (a speech bubble)', handouts: 'Handouts (a scroll)', help: 'Help', about: 'About', leave: 'Leave (a door)', more: 'More', grip: 'Arrange (six dots)' };
  el.innerHTML = `<div class="symhead"><b>The symbols, in the three themes</b><button type="button" onclick="symbols(false)">Close</button></div><div class="symcols">${['classic', 'sunlit', 'pocket'].map((th) => `<div class="frame symtheme" data-theme="${th}"><h3>${({ classic: 'Classic Tabletop', sunlit: 'Sunlit Wilds', pocket: 'Pocket Meadow' })[th]}</h3><div class="symgrid">${`<div class="sym"><span class="atile static">${sigil(CH.wren)}</span><small>Your character (its sigil, with the health ring)</small></div>` + ids.map((id) => `<div class="sym"><span class="atile static">${ico(id)}</span><small>${names[id]}</small></div>`).join('')}</div></div>`).join('')}</div>`;
}
function fit() { const W = ST.frame === 'phone' ? 390 : 1280, H = ST.frame === 'phone' ? 844 : 800; const s = Math.min(1, innerWidth / W, innerHeight / H); F.style.transform = s < 1 ? `scale(${s})` : ''; }
addEventListener('resize', fit);
(function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['theme', 'frame', 'state', 'motion', 'rule', 'hold', 'chars', 'look', 'token']) if (h.get(k)) ST[k] = h.get(k);
  if (!h.get('frame') && innerWidth >= 900) ST.frame = 'desktop';
  if (h.has('bare')) document.body.classList.add('bare');
  if (h.has('seen')) ST.seenRing = true;
  if (innerWidth < 600 || h.has('bare')) $('mock').open = false;
  fit(); syncMock(); renderHud();
  if (h.has('waiting')) addHandout();
  if (h.has('hit')) hit();
  const open = h.get('open');
  if (open) {
    if (open === 'root') { openArc(true); }
    const m = { root: [], arrange: ['setup', 'arrange'], character: ['character:wren'], cast: ST.frame === 'desktop' ? ['character:wren', 'g:cast'] : ['character:wren'], story: ['character:wren'] }[open] ?? [open];
    if (open === 'cast' && ST.frame === 'phone') ST.folds.add('g:cast');
    if (open === 'story') { ST.folds.add('g:story'); }
    if (open !== 'root') { ST.path = m; } const keep = ST.motion; if (open === 'root') ST.motion = keep; else { ST.motion = 'appear'; F.classList.add('appear'); openMenu(true); ST.motion = keep; renderMenu(); }
    if (open === 'story') { const b = $('levels').querySelector('.level:last-child .lbody'); b.scrollTop = b.scrollHeight; }
    setTimeout(() => { F.classList.toggle('appear', ST.motion === 'appear'); }, 50);
  }
  if (h.get('prompt') === 'reaction') reaction();
  if (h.get('prompt') === 'initiative') initiative();
  if (h.get('prompt') === 'aim') aim();
  if (h.has('arc')) { openArc(true); if (h.has('labels')) { ST.labelsShown = true; $('arc').classList.add('labels'); } }
  if (h.has('symbols')) symbols(true);
})();
</script>
