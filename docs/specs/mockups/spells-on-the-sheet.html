<!-- A picture to react to (docs/specs/spells-on-the-sheet.md). Nothing here runs the game; the rules for each moment are written out by hand below.

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: #111614; color: #e8e4d8; font: 15px/1.4 'Segoe UI', system-ui, sans-serif; }
[hidden] { display: none !important; }
/* ---------- the mockup's own controls (not part of the design) ---------- */
#mock { position: sticky; top: 0; z-index: 20; background: #0b0f0d; border-bottom: 1px solid #333; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
#mock h1 { font-size: 14px; margin: 0; flex-basis: 100%; font-weight: 600; color: #bbb; }
#mock fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
#mock legend { float: left; font-size: 12px; color: #999; margin-right: 4px; padding: 0; }
#mock label { position: relative; }
#mock input { position: absolute; opacity: 0; inset: 0; margin: 0; }
#mock span { display: inline-block; font-size: 12px; padding: 4px 8px; border: 1px solid #444; border-radius: 4px; color: #ccc; cursor: pointer; }
#mock input:checked + span { background: #ddd; color: #111; border-color: #ddd; }
#mock input:focus-visible + span { outline: 2px solid #8cf; outline-offset: 1px; }
#note { max-width: 1280px; margin: 8px auto 0; padding: 0 12px; font-size: 13px; color: #aaa; }
#stage { padding: 12px; display: flex; justify-content: center; }
/* ---------- the theme: tokens copied from packages/client/themes.js (the default theme) ---------- */
.frame { --bg: #1d2622; --panel: #26322d; --panel-2: #31403a; --ink: #efe9d8; --muted: #a9b3a6; --accent: #d7a84a; --accent-ink: #1d2622; --line: #4a5a52; --good: #7fc48a; --bad: #e0685a;
  --display: 'Vollkorn SC', Georgia, serif; --body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --radius: 6px;
  background: var(--bg); color: var(--ink); font-family: var(--body); border: 1px solid #444; position: relative; overflow: hidden; }
.frame[data-size=phone] { width: 390px; height: 844px; border-radius: 22px; }
.frame[data-size=desktop] { width: 1280px; height: 800px; max-width: 100%; display: flex; }
.map { flex: 1; background: radial-gradient(circle at 40% 40%, #4f7a46, #2c4a2c 70%); display: flex; align-items: center; justify-content: center; color: #ffffff55; font-size: 13px; }
.frame[data-size=phone] .map { display: none; }
.panel { background: var(--panel); height: 100%; overflow: auto; display: flex; flex-direction: column; }
.frame[data-size=desktop] .panel { width: 720px; border-left: 1px solid var(--line); }
.frame[data-size=desktop] .panel.with-chooser { width: 1020px; }
.body { display: flex; gap: 0; flex: 1; min-height: 0; }
.list { flex: 1; overflow: auto; padding: 0 16px 24px; min-width: 0; }
/* ---------- the design ---------- */
.head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.head h2 { font-family: var(--display); font-size: 18px; margin: 0; flex: 1; }
.btn { font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; }
.btn.small { min-height: 36px; font-size: 14px; }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.quiet { background: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h3 { font-family: var(--display); font-size: 15px; letter-spacing: .04em; margin: 18px 0 2px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
h3 small { font-family: var(--body); letter-spacing: 0; color: var(--muted); font-size: 13px; font-weight: 400; }
.rule { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
.rule b { color: var(--ink); font-weight: 600; }
.feat { border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px 10px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.feat b { color: var(--ink); }
.window { margin-top: 12px; background: var(--panel-2); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.window span { flex: 1 1 200px; }
.caster { color: var(--muted); font-size: 13px; margin-top: 10px; }
.slots { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; margin-top: 6px; font-size: 14px; }
.slots .pips { letter-spacing: 2px; color: var(--accent); font-size: 15px; }
.slots .back { color: var(--muted); font-size: 12px; flex-basis: 100%; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.frame[data-size=phone] .tiles { grid-template-columns: repeat(2, 1fr); }
.tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; min-height: 44px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.tile small { display: block; color: var(--muted); font-size: 12px; }
.tile b { font-size: 16px; }
.tile.over { border-color: var(--bad); } .tile.over b { color: var(--bad); }
.tile.under b { color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; min-height: 48px; border-bottom: 1px solid #ffffff10; padding: 2px 0; }
.row .nm { flex: 0 1 auto; font-weight: 600; min-width: 0; }
.row .meta { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.tag { border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; font-size: 12px; color: var(--ink); white-space: nowrap; }
.tag.feat { border-style: dashed; padding: 0 7px; margin: 0; color: var(--ink); }
.new { color: var(--good); font-weight: 600; }
.info { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 50%; width: 32px; height: 32px; min-width: 32px; cursor: pointer; font: 600 14px Georgia, serif; position: relative; }
.info::after { content: ''; position: absolute; inset: -6px; }   /* a 44 px target round a 32 px circle */
.frame[data-size=phone] .row { flex-wrap: wrap; }
.frame[data-size=phone] .row .nm { flex: 1 1 60%; }
.frame[data-size=phone] .row .meta { order: 3; flex-basis: 100%; padding-bottom: 4px; }
.open-pick { color: var(--accent); background: none; border: 1px dashed var(--line); border-radius: var(--radius); width: 100%; min-height: 44px; text-align: left; padding: 0 10px; font: inherit; cursor: pointer; margin-top: 6px; }
.lvl { font-size: 12px; color: var(--muted); margin: 8px 0 0; text-transform: uppercase; letter-spacing: .06em; }
.star { color: var(--accent); }
/* the chooser: a sheet over the list on a phone, a column beside it on a wide screen */
.chooser { background: var(--panel); display: flex; flex-direction: column; }
.frame[data-size=desktop] .chooser { width: 300px; border-left: 1px solid var(--line); }
.frame[data-size=phone] .chooser { position: absolute; left: 0; right: 0; bottom: 0; top: 12%; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px #0008; z-index: 5; }
.scrim { position: absolute; inset: 0; background: #0007; z-index: 4; }
.frame[data-size=desktop] .scrim { display: none; }
.chooser .head h2 { font-size: 16px; }
.chooser .why { padding: 6px 16px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
.chooser .opts { overflow: auto; padding: 0 16px 16px; }
.chooser .opt { display: flex; align-items: center; gap: 8px; min-height: 48px; border-bottom: 1px solid #ffffff10; }
.chooser .opt button.pick { flex: 1; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; min-height: 44px; cursor: pointer; }
.chooser .opt small { color: var(--muted); }
/* the scroll card (#566) */
.scroll { position: absolute; z-index: 9; max-width: 300px; padding: 14px 16px 16px; color: #3b2a14; background: linear-gradient(#f3e3bf, #ead6a8); border-radius: 4px; box-shadow: 0 6px 24px #000a; font: 14px/1.45 Georgia, serif; }
.scroll::before, .scroll::after { content: ''; position: absolute; left: -6px; right: -6px; height: 10px; background: #c9ad78; border-radius: 6px; }
.scroll::before { top: -6px; } .scroll::after { bottom: -6px; }
.scroll b { display: block; font-size: 15px; margin-bottom: 2px; }
.scroll small { display: block; color: #6b5532; margin-bottom: 6px; }
.foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; background: var(--panel); }
.foot .btn.accent { flex: 1; }
.count { color: var(--muted); font-size: 12px; }
</style>
</head>

Guidance",0,"c","A willing creature the caster touches adds 1d4 to ability checks with one skill the caster chooses, while the caster concentrates, up to a minute."],"light":["Light",0,"cw","A touched object glows like a torch for an hour, in a colour the caster picks."],"mage-hand":["Mage Hand",0,"w","A floating spectral hand that can do simple fetch-and-carry tasks up to 30 feet away for a minute. It cannot attack."],"mending":["Mending",0,"cw","Takes a minute to mend a single small break or tear in an object, leaving no trace."],"message":["Message",0,"w","A private whispered message to one creature in range, with a whispered reply. Thick barriers and magical silence block it."],"minor-illusion":["Minor Illusion",0,"w","Creates a sound or a small silent image. A creature that studies it can see through it with an Investigation check against the caster's spell save DC."],"poison-spray":["Poison Spray",0,"w","A ranged spell attack against one creature in range. On a hit it takes poison damage, which grows at higher character levels."],"prestidigitation":["Prestidigitation",0,"w","A small bag of party tricks: sensory effects, cleaning, warming, marking, or a trinket or image that lasts a moment. It deals no damage."],"ray-of-frost":["Ray of Frost",0,"w","A ranged spell attack for cold damage, growing at higher character levels. A target that is hit loses 10 feet of Speed until the start of the caster's next turn."],"resistance":["Resistance",0,"c","A willing creature the caster touches reduces damage of one chosen type by 1d4, at most once a turn, while the caster concentrates, up to a minute."],"shocking-grasp":["Shocking Grasp",0,"w","A melee spell attack for lightning damage, growing at higher character levels. A target that is hit cannot make Opportunity Attacks until the start of its next turn; the DM enforces that."],"spare-the-dying":["Spare the Dying",0,"c","A creature at 0 hit points that is not dead becomes stable. The range grows at higher character levels."],"thaumaturgy":["Thaumaturgy",0,"c","The caster makes one minor, harmless sign of power, such as a booming voice, flickering flames or a door banging open."],"true-strike":["True Strike",0,"w","The caster attacks once with a weapon they are proficient with, using their spellcasting ability, and may turn the damage radiant. Extra radiant damage is added at higher character levels."],"alarm":["Alarm",1,"w","A ward on a door, window or small area that alerts the caster, by sound or by a mental ping, when something touches or enters it. Takes a minute to cast; it can be a ritual."],"bane":["Bane",1,"c","Up to three creatures the caster can see (one more per slot level above 1) make a Charisma save; each that fails subtracts 1d4 from its attack rolls and saving throws while the caster concentrates, up to a minute."],"bless":["Bless",1,"c","Up to three chosen creatures (one more per slot level above 1) add 1d4 to their attack rolls and saving throws while the caster concentrates, up to a minute."],"charm-person":["Charm Person",1,"w","One visible Humanoid makes a Wisdom save, with Advantage if the caster or an ally is fighting it, or is charmed for an hour and Friendly to the caster, until the caster or an ally damages it; one more Humanoid per slot level above 1. The engine applies the save, the Advantage, the charm and its ending on damage; the DM handles the Humanoid restriction, the Friendly attitude and the target's knowledge afterward."],"chromatic-orb":["Chromatic Orb",1,"w","A ranged spell attack for 3d8 damage of a type the caster picks (more with higher slots), which the engine rolls. When two or more of the d8s match, the orb can leap to another target; the DM rolls the leaps."],"color-spray":["Color Spray",1,"w","Each creature in a 15-foot cone makes a Constitution save or is Blinded until the end of the caster's next turn."],"command":["Command",1,"c","One creature makes a Wisdom save or follows a one-word command (approach, drop, flee, grovel or halt) on its next turn."],"comprehend-languages":["Comprehend Languages",1,"w","For an hour the caster understands spoken and signed languages, and written ones by touch. It can be a ritual."],"create-or-destroy-water":["Create or Destroy Water",1,"c","Makes or removes water: about 10 gallons in a container, or rain or fog in a 30-foot cube."],"detect-evil-and-good":["Detect Evil and Good",1,"c","The caster senses aberrations, celestials, elementals, fey, fiends and undead within 30 feet while concentrating."],"detect-magic":["Detect Magic",1,"cw","The caster senses magic within 30 feet while concentrating, and can learn the school of a visible aura. It can be a ritual."],"detect-poison-and-disease":["Detect Poison and Disease",1,"c","The caster senses poisons, venomous creatures and magical contagions within 30 feet while concentrating. It can be a ritual."],"disguise-self":["Disguise Self",1,"w","The caster looks different for an hour. A touch reveals the illusion, and a creature that studies it can see through it with an Investigation check."],"expeditious-retreat":["Expeditious Retreat",1,"w","The caster Dashes on casting it and can Dash as a bonus action each turn while concentrating."],"false-life":["False Life",1,"w","The caster gains 2d4+4 Temporary Hit Points, and 5 more per slot level above 1."],"feather-fall":["Feather Fall",1,"w","Up to five falling creatures drift down slowly and take no fall damage. It is cast as a reaction."],"find-familiar":["Find Familiar",1,"w","Summons a spirit companion in the form of a CR 0 Beast, as a Celestial, Fey or Fiend, that acts on its own turn but cannot attack; an hour to cast, or a ritual. One familiar a caster: casting again gives it the new form. The engine dismisses it to a pocket dimension or forever and recalls it, and lets it deliver a touch spell with its Reaction; the DM runs telepathy and seeing through its eyes. No Octopus form: the SRD has no block."],"fog-cloud":["Fog Cloud",1,"w","A 20-foot-radius sphere of fog that is Heavily Obscured while the caster concentrates, up to an hour. The engine lays out 20 feet; the DM widens it for a higher slot (20 feet more per level) and ends it when a strong wind disperses it."],"floating-disk":["Floating Disk",1,"w","A floating disk of force carries up to 500 pounds and follows the caster for an hour. It can be a ritual."],"grease":["Grease",1,"w","A 10-foot square of slick grease for a minute, Difficult Terrain: each creature in it when it appears, and each that enters it or ends its turn there, makes a Dexterity save or falls Prone."],"guiding-bolt":["Guiding Bolt",1,"c","A ranged spell attack for radiant damage, growing with higher slots. The next attack roll made against a target that is hit, before the end of the caster's next turn, has Advantage."],"hideous-laughter":["Hideous Laughter",1,"w","One creature makes a Wisdom save or falls prone and is incapacitated, laughing, while the caster concentrates; one more creature per slot level above 1. It repeats the save at the end of each of its turns. The engine does not give the target Advantage on that save when it is damaged and does not stop it from standing up; the DM handles those."],"ice-knife":["Ice Knife",1,"w","A ranged spell attack for piercing damage. The shard then bursts around the target, hit or miss: the target and each creature within 5 feet of it make a Dexterity save or take cold damage, which grows with higher slots. The engine resolves the attack and the DM resolves the burst."],"identify":["Identify",1,"w","Touching an object reveals its magic properties; touching a creature reveals the spells on it. Takes a minute; it can be a ritual."],"illusory-script":["Illusory Script",1,"w","Writing that only the caster and chosen creatures can read, and that looks like gibberish to everyone else. It can be a ritual."],"inflict-wounds":["Inflict Wounds",1,"c","A touched creature makes a Constitution save, taking necrotic damage on a failure or half on a success. Damage grows with higher slots."],"jump":["Jump",1,"w","A touched creature can jump up to 30 feet, once per turn, for 10 feet of its movement."],"longstrider":["Longstrider",1,"w","A touched creature's Speed rises by 10 feet for an hour; one more creature per slot level above 1."],"mage-armor":["Mage Armor",1,"w","A touched willing creature without armor gets a base AC of 13 plus its Dexterity modifier for 8 hours."],"protection-from-evil-and-good":["Protection from Evil and Good",1,"cw","A touched creature is guarded against aberrations, celestials, elementals, fey, fiends and undead while the caster concentrates."],"purify-food-and-drink":["Purify Food and Drink",1,"c","Removes poison and rot from nonmagical food and drink in a 5-foot-radius sphere. It can be a ritual."],"ray-of-sickness":["Ray of Sickness",1,"w","A ranged spell attack for poison damage, growing with higher slots. A target that is hit is also Poisoned until the end of the caster's next turn."],"sanctuary":["Sanctuary",1,"c","A warded creature is hard to attack: attackers make a Wisdom save or must pick a new target. It ends if the warded creature attacks or casts."],"shield":["Shield",1,"w","Cast as a Reaction when the caster is hit by an attack roll or targeted by Magic Missile: +5 to AC until the start of the caster's next turn, including against the attack that set it off, and no damage from Magic Missile meanwhile. Cast by standing instruction: never, only if it turns the hit into a miss, always, or ask its player."],"silent-image":["Silent Image",1,"w","A purely visual illusion, up to a 15-foot cube, that the caster can move while concentrating."],"sleep":["Sleep",1,"w","Each creature of the caster's choice in a small sphere makes a Wisdom save or is Incapacitated until the end of its next turn, which the engine runs. The DM runs the second save and the Unconscious condition that follows, wakes a creature that is hurt or shaken, and applies the automatic successes of elves and creatures immune to Exhaustion."],"thunderwave":["Thunderwave",1,"w","Each creature in a 15-foot cube from the caster makes a Constitution save, taking thunder damage on a failure (half on a success; more with higher slots) and being pushed 10 feet away on a failure. Unsecured objects inside the cube are also pushed 10 feet, and the boom is heard 300 feet away. The engine lays out the cube and resolves the creatures; the DM moves the objects."],"unseen-servant":["Unseen Servant",1,"w","An invisible, mindless servant that does simple chores for an hour. It cannot attack. It can be a ritual."],"acid-arrow":["Acid Arrow",2,"w","A ranged spell attack: 4d4 acid on a hit, and half of that initial damage (2d4) on a miss. The engine scales only the hit damage with higher slots; the DM adds the extra 1d4 per slot level to the miss damage, and rolls the second dose of acid (2d4, also +1d4 per slot level above 2) at the end of the target's next turn."],"aid":["Aid",2,"c","Up to three creatures in range raise their Hit Point maximum and current Hit Points by 5 for 8 hours, and by 5 more per slot level above 2."],"alter-self":["Alter Self",2,"w","The caster takes on one of three forms: gills and a Swim Speed equal to Speed, a changed appearance, or natural weapons that make Unarmed Strikes deal 1d6. A Magic action swaps the option."],"arcane-lock":["Arcane Lock",2,"w","Magically locks a closed door, window, gate, container or hatch until dispelled. Only the caster and chosen creatures can open it, and a spoken password opens it for a minute."],"arcanists-magic-aura":["Arcanist's Magic Aura",2,"w","An illusion on a willing creature (it counts as a chosen creature type to spells) or on an unworn object (it reads as magical, nonmagical or of a chosen school), for 24 hours."],"augury":["Augury",2,"cw","A one-minute ritual that gives an omen (weal, woe, both, or indifference) about the results of a course of action planned in the next 30 minutes. Repeat casts risk no answer."],"blindness-deafness":["Blindness/Deafness",2,"cw","One creature the caster can see makes a Constitution save or is Blinded or Deafened (caster's choice) for a minute, repeating the save at the end of each turn; one more creature per slot level above 2. The engine applies Blinded; the DM swaps in Deafened if that was chosen."],"blur":["Blur",2,"w","Attack rolls against the caster have Disadvantage while it lasts, up to a minute of Concentration. An attacker that perceives the caster with Blindsight or Truesight is immune; the engine cannot judge that, so the DM does."],"calm-emotions":["Calm Emotions",2,"c","Each Humanoid in a 20-foot-radius sphere makes a Charisma save, and on a failure the caster chooses either Immunity to Charmed and Frightened or Indifference toward chosen hostile creatures."],"continual-flame":["Continual Flame",2,"cw","A touched object gives off a heatless flame that sheds Bright Light 20 feet and Dim Light 20 feet more, until dispelled."],"darkness":["Darkness",2,"w","Magical Darkness fills a 15-foot-radius sphere (or a 15-foot emanation from an object) that Darkvision cannot see through and nonmagical light cannot light. It dispels overlapping light spells of level 2 or lower."],"darkvision":["Darkvision",2,"w","A touched willing creature has Darkvision with a range of 150 feet for 8 hours."],"detect-thoughts":["Detect Thoughts",2,"w","Sense thoughts within 30 feet, or read the surface thoughts of a creature in view and probe deeper with a Wisdom save, for up to a minute of Concentration."],"dragons-breath":["Dragon's Breath",2,"w","A touched willing creature chosen with one of five damage types can exhale a 15-foot cone as a Magic action: Dexterity save, 3d6 damage of that type, half on a success. Concentration, up to a minute."],"enhance-ability":["Enhance Ability",2,"cw","A touched creature has Advantage on ability checks with one ability the caster chooses (Strength, Dexterity, Intelligence, Wisdom or Charisma) for up to an hour of Concentration; one more creature per slot level above 2. The SRD lets each target have its own ability; the engine gives every target of one casting the same one."],"enlarge-reduce":["Enlarge/Reduce",2,"w","Enlarges or reduces a creature or loose object one size category for a minute. An unwilling creature gets a Constitution save."],"find-traps":["Find Traps",2,"c","Senses any trap in line of sight within 120 feet and its general nature, but not its location."],"flaming-sphere":["Flaming Sphere",2,"w","A 5-foot sphere of fire sits on the ground for up to a minute. A creature ending its turn within 5 feet makes a Dexterity save or takes 2d6 fire. A Bonus Action rolls it 30 feet."],"gentle-repose":["Gentle Repose",2,"cw","A touched corpse is protected from decay and cannot become Undead for 10 days, and those days do not count against the time limit for raising it."],"gust-of-wind":["Gust of Wind",2,"w","A 60-foot-long, 10-foot-wide line of wind: each creature in it makes a Strength save or is pushed 15 feet away from the caster. The engine lays out the line and resolves the first save; the DM repeats the save for creatures ending a turn there, and handles the extra movement toward the caster, the flames and gas, and changes of direction."],"hold-person":["Hold Person",2,"cw","A Humanoid the caster can see makes a Wisdom save or is Paralyzed for up to a minute, repeating the save at the end of each of its turns; one more Humanoid per slot level above 2. The engine does not check that the target is Humanoid; the DM does."],"invisibility":["Invisibility",2,"w","A touched creature is Invisible for up to an hour of Concentration; one more creature per slot level above 2. The DM ends it early right after the creature attacks, deals damage or casts a spell."],"knock":["Knock",2,"w","Unlocks, unsticks or unbars one object in range (one lock if several) with a loud knock audible 300 feet away. It suppresses Arcane Lock for 10 minutes."],"lesser-restoration":["Lesser Restoration",2,"c","Ends one condition the caster  Thunder damage, creatures there are Deafened, and Verbal spells cannot be cast."],"spider-climb":["Spider Climb",2,"w","A touched willing creature can climb vertical surfaces and ceilings with free hands and gains a Climb Speed equal to its Speed, for up to an hour of Concentration."],"spiritual-weapon":["Spiritual Weapon",2,"c","A floating spectral weapon appears within range for up to a minute. On casting, and as a Bonus Action later (moving it 20 feet), the caster makes a melee spell attack from it for 1d8 plus the spellcasting modifier force damage."],"suggestion":["Suggestion",2,"w","The caster names a course of activity (25 words or fewer) to a creature that can hear and understand it; the target makes a Wisdom save or is Charmed for up to 8 hours of Concentration and follows it. The DM judges the suggestion, ends the charm when the caster or allies damage the target or the task is done."],"warding-bond":["Warding Bond",2,"c","A willing touched creature within 60 feet of the caster gets +1 to AC and saving throws and Resistance to all damage for an hour; the engine applies those. Each time it takes damage the caster takes the same amount, and the spell ends if the caster drops to 0 Hit Points, they are more than 60 feet apart, or it is recast; the DM handles those."],"web":["Web",2,"w","A 20-foot cube of sticky webbing for up to an hour of Concentration. The first time on a turn a creature enters it or starts its turn there, it makes a Dexterity save or is Restrained until the spell ends. The engine runs those saves, the Difficult Terrain and the Light Obscurement; the DM handles the collapse at the start of the caster's next turn if nothing anchors the webs, the Athletics check (an action, against the spell save DC) that frees a creature, freeing one that leaves the webs, and the webs burning away."],"zone-of-truth":["Zone of Truth",2,"c","A 15-foot-radius zone for 10 minutes: a creature entering it for the first time on a turn or starting its turn there makes a Charisma save, and on a failure cannot speak a deliberate lie while inside. The engine runs the zone and the saves and tells the DM who failed; the DM holds them to it."],"animate-dead":["Animate Dead",3,"cw","Turns the corpse of a Medium or Small Humanoid within range into a Zombie under the caster's control for 24 hours (a Bonus Action commands any of them within 60 feet), or casting it on the caster's own Zombies before then reasserts control over up to four; a higher slot animates or reasserts two more each. The DM handles bones and the Skeleton (no bones on the map: spawn a skeleton and bond it as undead with orders command) and whether a creature keeps to a standing order."],"beacon-of-hope":["Beacon of Hope",3,"c","Chosen creatures in range have Advantage on Wisdom saves and Death Saving Throws for up to a minute of Concentration. The engine applies the Wisdom save Advantage to the one creature aimed at. The DM covers any other creatures, gives Advantage on Death Saving Throws (the engine does not read modifiers on those), and makes healing they receive in that time restore the maximum possible."],"bestow-curse":["Bestow Curse",3,"cw","A touched creature makes a Wisdom save or is cursed for up to a minute with one of four effects: Disadvantage on one ability's checks and saves, Disadvantage on attacks against the caster, a forced Dodge, or +1d8 necrotic damage from the caster. Higher slots lengthen it."],"blink":["Blink",3,"w","At the end of each of the caster's turns for a minute, roll a d6; on 4 to 6 the caster shifts to the Ethereal Plane until the start of its next turn, then returns to a space within 10 feet."],"clairvoyance":["Clairvoyance",3,"cw","Creates an Invisible sensor within a mile, in a familiar or obvious place, through which the caster sees or hears (switchable as a Bonus Action) for up to 10 minutes of Concentration."],"counterspell":["Counterspell",3,"w","A Reaction when a creature within 60 feet casts a spell with Verbal, Somatic or Material components: it makes a Constitution save or the spell fizzles, wasting its action and (if a slot was used) not spending the slot. Cast by standing instruction (never, always, or ask its player) against a spell the engine casts; spells the DM casts by hand, and reaction spells, are the DM's to counter."],"create-food-and-water":["Create Food and Water",3,"c","Creates 45 pounds of bland, nourishing food and 30 gallons of clean water on the ground or in containers within 30 feet. The food spoils after 24 hours."],"daylight":["Daylight",3,"c","Sunlight fills a 60-foot-radius sphere (Bright Light, with Dim Light 60 feet more), or a 60-foot emanation from an object, for an hour. It dispels overlapping Darkness from a spell of level 3 or lower."],"dispel-magic":["Dispel Magic",3,"cw","Ends any ongoing spell of level 3 or lower on a creature, object or magical effect in range; for a higher-level spell the caster makes a spellcasting ability check (DC 10 + level). A higher slot ends spells up to that level automatically."],"fear":["Fear",3,"w","Each creature in a 30-foot cone from the caster makes a Wisdom save or becomes Frightened for up to a minute of Concentration. The engine applies Frightened; the DM makes the creature drop what it holds, makes it Dash away each turn by the safest route, and lets it end the spell with a Wisdom save at the end of a turn spent out of the caster's line of sight."],"fireball":["Fireball",3,"w","A burst of fire: each creature in a 20-foot-radius sphere makes a Dexterity save, taking 8d6 fire damage on a failure or half on a success; damage grows with higher slots. Flammable objects in the area that are not worn or carried start burning, which the DM applies."],"fly":["Fly",3,"w","A touched willing creature gains a Fly Speed of 60 feet and can hover for up to 10 minutes of Concentration, and falls when it ends if still aloft. Higher slots add one creature each."],"gaseous-form":["Gaseous Form",3,"w","A willing touched creature becomes a mist for up to an hour of Concentration, with Resistance to Bludgeoning, Piercing and Slashing damage and Advantage on Strength, Dexterity and Constitution saves, which the engine applies; one more creature per slot level above 3. The DM handles the Fly Speed of 10, passing through openings and other creatures' spaces, the Prone immunity, and being unable to talk, use objects, attack or cast."],"glyph-of-warding":["Glyph of Warding",3,"cw","A one-hour inscription of a glyph on a surface or inside a closable object that later triggers: an explosive rune (5d8 damage in a 20-foot-radius sphere, Dexterity save for half) or a stored spell of level 3 or lower. Lasts until dispelled or triggered."],"haste":["Haste",3,"w","A willing creature gets +2 to AC and Advantage on Dexterity saves for up to a minute of Concentration, which the engine applies. The DM doubles its Speed and gives it an extra action each turn (one attack, Dash, Disengage, Hide or Utilize), and when the spell ends it is Incapacitated with Speed 0 until the end of its next turn."],"hypnotic-pattern":["Hypnotic Pattern",3,"w","A twisting pattern in a 30-foot cube: each creature that can see it makes a Wisdom save or is Charmed for up to a minute of Concentration, and while Charmed is Incapacitated with a Speed of 0. The engine lays out the cube; only a creature that can see the pattern is affected, which it cannot judge yet, so it hands each creature in the cube to the DM, who applies these to those that see it and ends the effect on a creature that takes damage or is shaken awake."],"lightning-bolt":["Lightning Bolt",3,"w","A 100-foot-long, 5-foot-wide line of lightning from the caster in a chosen direction: each creature in it makes a Dexterity save, taking 8d6 lightning damage on a failure or half on a success; damage grows with higher slots."],"magic-circle":["Magic Circle",3,"cw","A 10-foot-radius, 20-foot-tall cylinder for an hour that bars chosen types (Celestial, Elemental, Fey, Fiend, Undead) from willingly entering, gives them Disadvantage against targets inside and stops them possessing or charming or frightening those inside. It can be reversed."],"major-image":["Major Image",3,"w","An illusory object, creature or phenomenon up to a 20-foot cube with sound, smell and temperature, for up to 10 minutes. It cannot deal damage or cause conditions, and a Study action with an Investigation check can see through it."],"mass-healing-word":["Mass Healing Word",3,"c","Up to six creatures of the caster's choice that it can see in range regain 2d4 Hit Points plus the caster's spellcasting modifier, more with higher slots."],"meld-into-stone":["Meld into Stone",3,"c","The caster merges with a stone object or surface for 8 hours, undetectable by nonmagical senses. Damage to the stone expels it with force damage (6d6 for partial damage, 50 if destroyed)."],"nondetection":["Nondetection",3,"w","For 8 hours a touched creature, place or object (up to 10 feet in any dimension) cannot be targeted by Divination spells or perceived through scrying sensors."],"phantom-steed":["Phantom Steed",3,"w","A Large horselike steed for an hour: a Riding Horse with Speed 100 feet, acting straight after the caster (the SRD gives no Initiative rule), ridden as the Riding Horse is (a trained mount). Made by the DM's spawn (a cast with no picks) it has the pack's Speed 60, so the DM notes the 100. The DM ends the spell when the steed takes damage, and handles the 13 miles an hour, its fading over a minute and its tack."],"protection-from-energy":["Protection from Energy",3,"cw","A willing touched creature has Resistance to one damage type the caster chooses from Acid, Cold, Fire, Lightning or Thunder, for up to an hour of Concentration."],"remove-curse":["Remove Curse",3,"cw","Ends all curses on a touched creature or object. A cursed magic item keeps its curse, but its owner's Attunement is broken so it can be removed or discarded."],"revivify":["Revivify",3,"c","A touched creature that died within the last minute returns to life with 1 Hit Point. It cannot restore a creature that died of old age or any missing body parts."],"sending":["Sending",3,"cw","Sends a message of 25 words or fewer to a creature the caster has met or has had described, at any distance and even across planes (5 percent chance of failure across planes). The target can reply at once and can block the caster for 8 hours."],"sleet-storm":["Sleet Storm",3,"w","Sleet falls in a 20-foot-radius, 40-foot-tall cylinder for up to a minute of Concentration: the area is Heavily Obscured and its ground Difficult Terrain. A creature entering it for the first time on a turn or starting its turn there makes a Dexterity save or falls Prone and loses Concentration. The engine runs all of that; the DM douses exposed flames in the area."],"slow":["Slow",3,"w","In a 40-foot cube, up to six creatures make a Wisdom save or are slowed for up to a minute of Concentration: -2 to AC and Dexterity saves. The caster picks up to six creatures in the cube and the engine applies the save and those two penalties. The DM halves Speed, takes away Reactions, limits them to an action or a Bonus Action and one attack, applies the 25 percent chance of a failed somatic spell, and lets them repeat the save at each turn's end."],"speak-with-dead":["Speak with Dead",3,"cw","A corpse with a mouth that was not Undead answers up to five questions over 10 minutes with what it knew in life, briefly and cryptically. It fails if the corpse was the target within the past 10 days."],"spirit-guardians":["Spirit Guardians",3,"c","Spirits fill a 15-foot emanation that moves with the caster for up to 10 minutes of Concentration. A creature the caster did not spare makes a Wisdom save when it enters the emanation (or the emanation reaches it) and when it ends its turn there, at most once a turn, taking 3d8 damage on a failure or half on a success (radiant for a good or neutral caster, necrotic for an evil one: the caster picks the one that applies); more with higher slots. The engine runs the zone; the DM halves the Speed of those creatures in it."],"stinking-cloud":["Stinking Cloud",3,"w","A 20-foot-radius sphere of Heavily Obscuring gas for up to a minute: a creature starting its turn in it makes a Constitution save or is Poisoned until the end of that turn and cannot take an action or Bonus Action."],"tiny-hut":["Tiny Hut",3,"w","A stationary 10-foot emanation for 8 hours bars everyone not inside when it was cast, blocks spells of level 3 or lower, stays comfortable, and is opaque outside. It takes a minute (or is a ritual) and ends if the caster leaves it."],"tongues":["Tongues",3,"cw","A touched creature understands any spoken or signed language it hears or sees, and anyone who knows a language can understand it, for an hour."],"vampiric-touch":["Vampiric Touch",3,"w","A melee spell attack for 3d6 necrotic damage, with more from higher slots; on a hit the caster regains half the damage dealt, which the DM applies. The DM also handles repeating the attack each turn as a Magic action for up to a minute of Concentration. The SRD gives the range as Self; it is entered as touch so the engine can reach a creature within reach."],"water-breathing":["Water Breathing",3,"w","Up to ten willing creatures within 30 feet can breathe underwater for 24 hours, while keeping their normal breathing. It can be a ritual."],"water-walk":["Water Walk",3,"c","Up to ten willing creatures within 30 feet can walk across any liquid surface as if it were solid ground for an hour. It can be a ritual."]};   // id: [name, level, lists ("w", "c", "cw"), text]

  card.style.width = `${cw}px`; card.style.left = `${x}px`;
  const below = r.bottom - f.top + 10;
  card.style.top = `${below + card.offsetHeight > f.height - 10 ? Math.max(10, r.top - f.top - card.offsetHeight - 10) : below}px`;
}
function hideCard() { card?.remove(); card = null; }
function cardHooks(node, id) {
  node.addEventListener('mouseenter', () => { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => showCard(id, node), 3000); });
  node.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); hideCard(); });
  node.addEventListener('touchstart', () => { clearTimeout(pressTimer); pressTimer = setTimeout(() => showCard(id, node), 500); }, { passive: true });
  for (const t of ['touchend', 'touchmove', 'touchcancel']) node.addEventListener(t, () => clearTimeout(pressTimer), { passive: true });
  return node;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { hideCard(); if (chooser) { chooser = null; draw(); } } });
document.addEventListener('pointerdown', (e) => { if (card && !card.contains(e.target) && !e.target.closest('.info')) hideCard(); });
const infoBtn = (id) => { const b = el('button', { class: 'info', type: 'button', 'aria-label': `About ${sp(id).name}`, text: 'i' }); b.onclick = (e) => { e.stopPropagation(); card ? hideCard() : showCard(id, b); }; return b; };

// ---------- the rows ----------
function spellRow(row, tags, { pool, onChange, extra } = {}) {
  const s = sp(row.id);
  const meta = el('div', { class: 'meta' }, ...tags.map((t) => el('span', { class: 'tag' + (/Magic Initiate|Domain/.test(t) ? ' feat' : ''), text: t })),
    row.isNew ? el('span', { class: 'new', text: row.was ? `new · in place of ${sp(row.was).name}` : 'new' }) : el('span', { text: row.at ? `chosen at level ${row.at}` : 'chosen before levels were kept' }), extra ?? null);
  const kids = [cardHooks(el('span', { class: 'nm', tabindex: '0', text: s.name }), row.id), meta];
  if (row.isNew && (row.was || ui.moment !== 'new')) kids.push(el('button', { class: 'btn small quiet', type: 'button', 'aria-label': `Take back ${s.name}`, text: '✕', onclick: () => { onChange('undo'); } }));
  else if (pool && left(pool) > 0) kids.push(el('button', { class: 'btn small', type: 'button', text: 'Change', onclick: () => onChange('change') }));
  kids.push(infoBtn(row.id));
  return el('div', { class: 'row' }, ...kids);
}
function openChooser(title, why, options, onPick) { chooser = { title, why, options, onPick }; hideCard(); draw(); }
const known = () => new Set([...w.cantrips, ...w.prepared].map((r) => r.id));
const topLevel = () => w.c.slots[w.lvl].length;
const poolOf = (list, lv) => Object.keys(POOL).filter((id) => POOL[id][2].includes(list) && (lv === 0 ? POOL[id][1] === 0 : POOL[id][1] >= 1 && POOL[id][1] <= topLevel()) && !known().has(id)).sort((a, b) => POOL[a][1] - POOL[b][1] || POOL[a][0].localeCompare(POOL[b][0]));

function swap(rows, i, pool, title, why, options) {
  const row = rows[i];
  openChooser(title, why, options, (id) => { rows[i] = { id, src: row.src, at: w.lvl, isNew: true, was: row.isNew ? row.was : row.id, pool }; if (!row.isNew) w.used[pool]++; chooser = null; draw(); });
}
function undo(rows, i) {
  const row = rows[i];
  if (row.was) { rows[i] = { ...CHARSROW(row), }; w.used[row.pool]--; } else rows.splice(i, 1);
  draw();
}
function CHARSROW(row) {   // the row as the sheet held it before this sitting
  const c = w.c, find = (list) => list.find((x) => x[0] === row.was);
  const k = find(c.cantrips), p = find(c.prepared), b = find(c.book ?? []);
  if (k) return { id: k[0], src: k[1], at: k[2] };
  if (p) return { id: p[0], at: p[1] };
  return { id: b[0], at: b[1] };
}

// ---------- the screen ----------
function draw() {
  const stage = document.getElementById('stage'); stage.textContent = '';
  const c = w.c, a = allow(), lvl = w.lvl, desk = ui.size === 'desktop';
  const frame = el('div', { class: 'frame', 'data-size': ui.size });
  const panel = el('div', { class: 'panel' + (chooser && desk ? ' with-chooser' : '') });
  const titles = { new: 'New character', level: `Level up ${c.name} to ${lvl}`, long: `${c.name} › Sheet › Spells`, other: `${c.name} › Sheet › Spells` };
  panel.append(el('div', { class: 'head' }, el('button', { class: 'btn quiet', type: 'button', text: '‹ Back' }), el('h2', { text: titles[ui.moment] })));
  const list = el('div', { class: 'list' });
  // The window after a rest (character screen), or the feat's line (build sheet).
  if (ui.moment === 'long') list.append(el('div', { class: 'window' }, el('span', { text: ui.who === 'wren' ? 'After your Long Rest you may change your prepared spells and one Wizard cantrip.' : 'After your Long Rest you may change your prepared spells.' }), el('button', { class: 'btn small', type: 'button', text: 'Done' })));
  if (ui.moment === 'new' || ui.moment === 'level') list.append(el('div', { class: 'feat' }, el('b', { text: 'Feats › Background: Magic Initiate' }), ` · ${LIST[c.mi.list]} list · ${c.mi.abilName}. `, el('span', { text: 'Its 2 cantrips and its level 1 spell are chosen under Spells, below.' })));
  // Who casts, the slots, the tiles.
  list.append(el('div', { class: 'caster', text: `${c.cls} · ${c.abil} · save DC ${c.dc} · attack ${c.atk}${c.mi ? ` · Magic Initiate spells: ${c.mi.abil}` : ''}` }));
  const slots = el('div', { class: 'slots' }, el('b', { text: 'Slots' }), ...c.slots[lvl].map((n, i) => el('span', {}, `Level ${i + 1} `, el('span', { class: 'pips', 'aria-label': `${n} slots`, text: '●'.repeat(n) }))), el('span', { class: 'back', text: 'All back on a Long Rest' }));
  list.append(slots);
  const prepMax = c.prepMax[lvl], prepN = w.prepared.length, always = [...c.always[4], ...(lvl >= 5 ? c.always[5] : [])];
  const clsC = w.cantrips.filter((r) => r.src === 'class').length;
  const tile = (label, value, id, cls) => el('button', { class: 'tile' + (cls ? ` ${cls}` : ''), type: 'button', onclick: () => document.getElementById(id)?.scrollIntoView({ block: 'start', behavior: 'smooth' }) }, el('small', { text: label }), el('b', { text: value }));
  list.append(el('div', { class: 'tiles' }, tile('Cantrips', `${w.cantrips.length} known`, 'g-cantrips'),
    tile('Prepared', `${prepN} of ${prepMax}`, 'g-prepared', prepN > prepMax ? 'over' : prepN < prepMax ? 'under' : ''),
    tile('Always prepared', String(always.length), 'g-always'),
    c.book ? tile('Spellbook', String(w.book.length), 'g-book') : tile('Free casts', '1 a day', 'g-always')));

  // CANTRIPS: one list.
  const miTag = `Magic Initiate · ${LIST[c.mi.list]} · ${c.mi.abil}`;
  list.append(el('h3', { id: 'g-cantrips' }, 'Cantrips', el('small', { text: `${w.cantrips.length} known · ${c.cls} ${c.cantMax[lvl]}${c.plus ? ` (${c.cantMax[lvl] - 1} + ${c.plus})` : ''} · Magic Initiate 2` })));
  const lines = LINES[ui.who];
  if (ui.moment !== 'new') {
    list.append(el('p', { class: 'rule' }, lines.clsCantrip, a.clsCantrip > 0 && a.clsCantrip < Infinity ? el('b', { text: ` Now: ${w.used.clsCantrip} of ${a.clsCantrip} used.` }) : null));
    list.append(el('p', { class: 'rule' }, lines.mi, a.mi > 0 && a.mi < Infinity ? el('b', { text: ` Now: ${w.used.mi} of ${a.mi} used.` }) : null));
  }
  w.cantrips.forEach((row, i) => {
    const pool = row.src === 'class' ? 'clsCantrip' : 'mi';
    const lst = row.src === 'class' ? c.list : c.mi.list;
    list.append(spellRow(row, [row.src === 'class' ? c.cls : miTag], { pool, onChange: (what) => what === 'undo' ? undo(w.cantrips, i) :
      swap(w.cantrips, i, pool, `Change ${sp(row.id).name}`, `A ${LIST[lst]} cantrip you do not know. ${pool === 'mi' ? 'Magic Initiate: one of its spells, for one of the same level from its list.' : ''}`, poolOf(lst, 0)) }));
  });
  if (ui.moment === 'new' && clsC < c.cantMax[lvl]) list.append(el('button', { class: 'open-pick', type: 'button', text: `+ Choose a ${c.cls} cantrip (${c.cantMax[lvl] - clsC} left)` }));

  // PREPARED
  list.append(el('h3', { id: 'g-prepared' }, 'Prepared', el('small', { text: `${prepN} of ${prepMax}` })));
  if (ui.moment !== 'new') list.append(el('p', { class: 'rule' }, lines.prepared, ui.moment === 'long' ? el('b', { text: ' Now: any of them.' }) : null));
  for (let lv = 1; lv <= topLevel(); lv++) {
    const here = w.prepared.map((r, i) => [r, i]).filter(([r]) => sp(r.id).level === lv);
    if (!here.length) continue;
    list.append(el('p', { class: 'lvl', text: `Level ${lv}` }));
    for (const [row, i] of here) {
      const fromBook = !!c.book;
      list.append(spellRow(row, [c.cls], { pool: 'prepared', onChange: (what) => what === 'undo' ? undo(w.prepared, i) :
        swap(w.prepared, i, 'prepared', `Change ${sp(row.id).name}`, fromBook ? 'A spell in your spellbook that is not prepared.' : `A ${c.cls} spell of a level you have slots for.`,
          fromBook ? w.book.map((b) => b.id).filter((id) => !known().has(id)) : poolOf(c.list, 1)) }));
    }
  }
  const morePrep = prepMax - prepN;
  if (morePrep > 0 && (ui.moment === 'level' || ui.moment === 'new')) {
    list.append(el('button', { class: 'open-pick', type: 'button', text: `+ Prepare a ${c.cls} spell (${morePrep} left${c.book ? ', from your spellbook' : ''})`, onclick: () =>
      openChooser('Prepare a spell', c.book ? 'A spell in your spellbook that is not prepared, of a level you have slots for.' : `A ${c.cls} spell of a level you have slots for (up to level ${topLevel()}).`,
        c.book ? w.book.map((b) => b.id).filter((id) => !known().has(id)) : poolOf(c.list, 1), (id) => { w.prepared.push({ id, at: lvl, isNew: true }); chooser = null; draw(); }) }));
  }

  // ALWAYS PREPARED
  list.append(el('h3', { id: 'g-always' }, 'Always prepared', el('small', { text: 'do not count' })));
  for (const [id, src, note, n] of always) list.append(spellRow({ id, at: lvl === 5 && n === 5 ? 5 : n, isNew: false }, [src], { extra: note ? el('span', { text: note }) : el('span', { text: '' }) }));

  // SPELLBOOK (Wizard)
  if (c.book) {
    const free = 6 + 2 * (lvl - 1), newBook = (a.newBook ?? 0) - w.book.filter((b) => b.isNew && ui.moment === 'level').length;
    list.append(el('h3', { id: 'g-book' }, 'Spellbook', el('small', { text: `${w.book.length} · ★ prepared · ${free} from levels, 0 copied` })));
    list.append(el('p', { class: 'rule', text: 'The book only grows: 6 spells at level 1 and 2 more at each Wizard level. A spell copied from a scroll is the DM\'s to allow.' }));
    for (let lv = 1; lv <= topLevel(); lv++) {
      const here = w.book.filter((b) => sp(b.id).level === lv);
      if (!here.length) continue;
      list.append(el('p', { class: 'lvl', text: `Level ${lv}` }));
      for (const b of here) {
        const on = w.prepared.some((p) => p.id === b.id);
        list.append(spellRow({ ...b }, on ? ['★ prepared'] : [], { onChange: () => { w.book.splice(w.book.indexOf(b), 1); draw(); } }));
        const lastMeta = list.lastChild.querySelector('.meta span:last-child');
        if (lastMeta && !b.isNew) lastMeta.textContent = `added at level ${b.at}`;
      }
    }
    if (ui.moment === 'level' && newBook > 0) list.append(el('button', { class: 'open-pick', type: 'button', text: `+ Add a Wizard spell to your spellbook (${newBook} left, up to level ${topLevel()})`, onclick: () =>
      openChooser('Add to your spellbook', `A Wizard spell of a level you have slots for (up to level ${topLevel()}), not already in the book.`,
        poolOf('w', 1).filter((id) => !w.book.some((b) => b.id === id)), (id) => { w.book.push({ id, at: lvl, isNew: true }); chooser = null; draw(); }) }));
  }
  if (ui.moment === 'other') list.append(el('p', { class: 'rule', text: 'Nothing can change now. The lines above say when each can.' }));

  const body = el('div', { class: 'body' }, list);
  if (chooser) {
    const ch = el('div', { class: 'chooser', role: 'dialog', 'aria-label': chooser.title },
      el('div', { class: 'head' }, el('button', { class: 'btn quiet', type: 'button', text: ui.size === 'phone' ? '‹ Back' : '✕', onclick: () => { chooser = null; draw(); } }), el('h2', { text: chooser.title })),
      el('div', { class: 'why', text: chooser.why }),
      el('div', { class: 'opts' }, ...(chooser.options.length ? chooser.options.map((id) => el('div', { class: 'opt' },
        cardHooks(el('button', { class: 'pick', type: 'button', onclick: () => chooser.onPick(id) }, sp(id).name, ' ', el('small', { text: sp(id).level ? `L${sp(id).level}` : 'cantrip' })), id), infoBtn(id))) : [el('p', { class: 'rule', text: 'Nothing else is allowed here.' })])));
    if (desk) body.append(ch); else { frame.append(el('div', { class: 'scrim', onclick: () => { chooser = null; draw(); } }), ch); }
  }
  panel.append(body);
  if (ui.moment === 'new' || ui.moment === 'level') panel.append(el('div', { class: 'foot' }, el('button', { class: 'btn accent', type: 'button', text: ui.moment === 'level' ? `Level up to ${lvl}` : 'Save' }), el('button', { class: 'btn', type: 'button', text: 'Cancel' })));
  frame.prepend(el('div', { class: 'map', text: 'the map' }), panel);
  stage.append(frame);
}
for (const r of document.querySelectorAll('#mock input')) r.onchange = () => { ui[r.name] = r.value; if (r.name !== 'size') reset(); draw(); };
reset(); draw();
window.mock = { ui, set(k, v) { ui[k] = v; document.querySelector(`#mock input[name=${k}][value=${v}]`).checked = true; if (k !== 'size') reset(); draw(); } };
</script>
</body>
